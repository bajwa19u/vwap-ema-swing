name: scan
# Hourly bars close at 10:30 ... 15:30 and 16:00 ET. Alpaca's free SIP feed
# lags 15 minutes, so run at :47 (and 16:17 ET for the last bar). The UTC
# windows cover both EDT and EST; extra runs are harmless (idempotent).
on:
  schedule:
    - cron: "47 14-20 * * 1-5"
    - cron: "17 20,21 * * 1-5"
  workflow_dispatch:

concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_VWAP: ${{ secrets.DISCORD_WEBHOOK_VWAP }}
      - name: commit state
        run: |
          git config user.name "vwap-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "scan: state $(date -u +%FT%H:%MZ)" && git pull --rebase && git push)
