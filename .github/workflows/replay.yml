name: replay
# Manual: replay the last N sessions to Discord as if live. seed=true hands the
# replayed open positions to the live bot and marks that day's recap as posted.
on:
  workflow_dispatch:
    inputs:
      sessions: { description: "sessions to replay", default: "5" }
      seed: { description: "hand positions to the live bot", type: boolean, default: false }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.replay ${{ inputs.sessions }} ${{ inputs.seed && '--seed' || '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_VWAP: ${{ secrets.DISCORD_WEBHOOK_VWAP }}
      - name: commit
        if: ${{ inputs.seed }}
        run: |
          git config user.name "vwap-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "replay seed $(date -u +%F)" && git pull --rebase && git push)
