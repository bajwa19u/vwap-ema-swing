name: longtest
# Manual: year-by-year check of the live rules on Alpaca history since 2016.
on: workflow_dispatch
permissions: { contents: write }
jobs:
  longtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # the branch head, not the commit this run was queued on: a run waiting
      # in the `state` queue would otherwise rebuild state from a stale copy
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.longtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: commit
        run: |
          git config user.name "vwap-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/longtest.md
          git diff --cached --quiet || (git commit -m "longtest $(date -u +%F)" && git pull --rebase --autostash && git push)
