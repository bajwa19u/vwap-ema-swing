name: recap
# Daily recap after the close (16:35 ET in both EDT and EST; posts once a day).
on:
  schedule:
    - cron: "35 20,21 * * 1-5"
  workflow_dispatch:
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.recap
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_VWAP: ${{ secrets.DISCORD_WEBHOOK_VWAP }}
      - name: commit
        run: |
          git config user.name "vwap-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "recap $(date -u +%F)" && git pull --rebase && git push)
