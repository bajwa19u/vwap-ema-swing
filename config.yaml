# Live configuration. research/ chose these; the weekly retune job may
# replace `params` only when a challenger beats them out of sample.
bot_name: "VWAP x EMA"
webhook_env: DISCORD_WEBHOOK_VWAP
history_days: 300            # calendar days of 30m bars fetched each scan
market: SPY                  # regime filter symbol

options:                     # contract suggestion on each entry (set to null to disable)
  dte_min: 21                # 21-30 DTE, ~0.85 delta won the options study (reports/ablation.md)
  dte_max: 30
  delta_target: 0.85

strategies:
  - name: "EMA21 x Weekly VWAP"
    typical_days: "3-5"
    params:
      tf: 1
      ema: 21
      vwap: week
      entry: cross_price     # the cross only counts if the close is also above the VWAP
      sides: long
      min_bars: 7
      week_grace: 2          # weekly VWAP resets Monday; ignore exits on its first 2 bars
      stop_atr: 6.0
      exit: cross
      regime: spyvw
      earn_skip: 2           # no new entries within 2 trading days of an earnings report
      earn_exit: true        # close before the earnings gap
    universe:
      top_k: 10
      vol_lookback_days: 120
      # candidates, ranked monthly by realized volatility; the top_k are traded
      pool: [AAPL, AMD, AMZN, ARM, AVGO, BA, COIN, CRM, GOOGL, HOOD, JPM, LLY, META,
             MSFT, MSTR, MU, NFLX, NVDA, ORCL, PLTR, SHOP, SMCI, TSLA, UBER, XOM]
    stats: "Holdout Jul 2025 - Sep 2026: 215 trades, win 57%, avg +1.48% per trade (shares), max drawdown -6.2%"
